<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none" role="img" aria-label="Kapadokya Kebapzade Restaurant">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E7B7"/>
      <stop offset="25%" stop-color="#DFBA73"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="75%" stop-color="#E8C779"/>
      <stop offset="100%" stop-color="#A57917"/>
    </linearGradient>
    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8E5A12" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Emblem / Seal -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Outer Octagon / Circle Ornament -->
    <circle cx="40" cy="40" r="38" stroke="url(#goldGrad)" stroke-width="1.8" fill="#1e0b08" stroke-dasharray="2 1.5"/>
    <circle cx="40" cy="40" r="34" stroke="url(#goldGrad)" stroke-width="0.8" fill="url(#crestGlow)"/>
    <circle cx="40" cy="40" r="30" stroke="url(#goldGrad)" stroke-width="1.2"/>
    
    <!-- Cappadocia / Fire Graphic Accent -->
    <path d="M40 18 C37 25 34 29 34 34 C34 38 37 40 40 40 C43 40 46 38 46 34 C46 29 43 25 40 18 Z" fill="url(#goldGrad)" opacity="0.4"/>

    <!-- Regal Initial 'K' -->
    <text x="40" y="49" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">K</text>
    
    <!-- Stars & Est. -->
    <path d="M26 60 L27 58 L28 60 L30 60.5 L28.5 62 L29 64 L27 63 L25 64 L25.5 62 L24 60.5 Z" fill="url(#goldGrad)"/>
    <text x="40" y="63" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.2">2008</text>
    <path d="M54 60 L55 58 L56 60 L58 60.5 L56.5 62 L57 64 L55 63 L53 64 L53.5 62 L52 60.5 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(102, 22)">
    <!-- Kicker / Location -->
    <text x="0" y="14" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#E2BC7E" letter-spacing="3.5" text-transform="uppercase">KAPADOKYA · GÖREME</text>
    
    <!-- Main Title -->
    <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="29" font-weight="700" fill="url(#goldGrad)" letter-spacing="1.5">KEBAPZADE</text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="60" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#D3C0AF" letter-spacing="4.2" text-transform="uppercase">AUTHENTIC CUISINE</text>
  </g>
</svg>
